<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ping Pong Clássico</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080c;
      --line: rgba(255, 255, 255, 0.16);
      --text: #f4f4f4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .wrap {
      width: min(96vw, 1100px);
      display: grid;
      gap: 12px;
    }

    h1 {
      text-align: center;
      letter-spacing: 0.28em;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 700;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #0a0c12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }

    .help {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      opacity: 0.72;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PING PONG</h1>
    <canvas id="game" width="1280" height="720"></canvas>
    <div class="help">
      <span>J1: W / S</span>
      <span>Espaço: sacar · A: humano/CPU</span>
      <span>J2: setas</span>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;
    const POINTS_TO_WIN = 7;

    const keys = new Set();
    const audio = createAudio();

    const state = {
      playing: false,
      matchOver: false,
      leftScore: 0,
      rightScore: 0,
      nextServe: Math.random() > 0.5 ? 1 : 2,
      rightUsesAi: true,
      status: "ESPACO para sacar",
    };

    const left = { x: 48, y: H / 2, w: 16, h: 118, speed: 9 };
    const right = { x: W - 64, y: H / 2, w: 16, h: 118, speed: 9 };
    const ball = { x: W / 2, y: H / 2, r: 9, vx: 0, vy: 0, speed: 0 };

    window.addEventListener("keydown", (event) => {
      keys.add(event.code);
      if (["Space", "ArrowUp", "ArrowDown"].includes(event.code)) {
        event.preventDefault();
      }
      if (event.code === "KeyA") {
        state.rightUsesAi = !state.rightUsesAi;
      }
      if (event.code === "Space") {
        if (state.matchOver) resetMatch();
        else if (!state.playing) serve();
      }
    });

    window.addEventListener("keyup", (event) => keys.delete(event.code));

    canvas.addEventListener("pointerdown", () => {
      if (state.matchOver) resetMatch();
      else if (!state.playing) serve();
    });

    function resetMatch() {
      state.leftScore = 0;
      state.rightScore = 0;
      state.matchOver = false;
      state.playing = false;
      state.nextServe = Math.random() > 0.5 ? 1 : 2;
      state.status = "ESPACO para sacar";
      stopBall();
    }

    function serve() {
      state.playing = true;
      state.status = "";
      const dir = state.nextServe === 2 ? 1 : -1;
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = 8.2;
      const angle = (Math.random() * 0.9 - 0.45);
      ball.vx = dir * Math.cos(angle);
      ball.vy = Math.sin(angle);
      normalizeBall();
    }

    function stopBall() {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.vx = 0;
      ball.vy = 0;
      ball.speed = 0;
    }

    function normalizeBall() {
      const mag = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx /= mag;
      ball.vy /= mag;
    }

    function goal(scoringPlayer) {
      state.playing = false;
      stopBall();
      audio.score();
      if (scoringPlayer === 1) state.leftScore += 1;
      else state.rightScore += 1;
      state.nextServe = scoringPlayer === 1 ? 2 : 1;

      if (state.leftScore >= POINTS_TO_WIN || state.rightScore >= POINTS_TO_WIN) {
        state.matchOver = true;
        const winner = state.leftScore > state.rightScore
          ? "JOGADOR 1"
          : (state.rightUsesAi ? "CPU" : "JOGADOR 2");
        state.status = winner + " VENCEU  ·  ESPACO para reiniciar";
        return;
      }
      state.status = "ESPACO para sacar";
    }

    function movePaddle(paddle, input) {
      paddle.y += input * paddle.speed;
      const half = paddle.h / 2;
      paddle.y = Math.max(40 + half, Math.min(H - 40 - half, paddle.y));
    }

    function playerInput(up, down) {
      let value = 0;
      if (keys.has(up)) value -= 1;
      if (keys.has(down)) value += 1;
      return value;
    }

    function aiInput() {
      if (!state.playing || ball.vx <= 0) return 0;
      const delta = ball.y - right.y;
      if (Math.abs(delta) < 10) return 0;
      return Math.sign(delta) * 0.82;
    }

    function update() {
      movePaddle(left, playerInput("KeyW", "KeyS"));
      movePaddle(right, state.rightUsesAi ? aiInput() : playerInput("ArrowUp", "ArrowDown"));

      if (!state.playing) return;

      ball.x += ball.vx * ball.speed;
      ball.y += ball.vy * ball.speed;

      if (ball.y - ball.r <= 28) {
        ball.y = 28 + ball.r;
        ball.vy *= -1;
        audio.wall();
      } else if (ball.y + ball.r >= H - 28) {
        ball.y = H - 28 - ball.r;
        ball.vy *= -1;
        audio.wall();
      }

      hitPaddle(left, 1);
      hitPaddle(right, -1);

      if (ball.x < -20) goal(2);
      if (ball.x > W + 20) goal(1);
    }

    function hitPaddle(paddle, xDir) {
      const closestX = clamp(ball.x, paddle.x, paddle.x + paddle.w);
      const closestY = clamp(ball.y, paddle.y - paddle.h / 2, paddle.y + paddle.h / 2);
      const dx = ball.x - closestX;
      const dy = ball.y - closestY;
      if (dx * dx + dy * dy > ball.r * ball.r) return;
      if (Math.sign(ball.vx) === xDir) return;

      const offset = clamp((ball.y - paddle.y) / (paddle.h / 2), -1, 1);
      ball.vx = xDir;
      ball.vy = offset;
      normalizeBall();
      ball.speed = Math.min(16, ball.speed + 0.45);
      ball.x = xDir > 0 ? paddle.x + paddle.w + ball.r + 1 : paddle.x - ball.r - 1;
      audio.paddle();
    }

    function draw() {
      ctx.fillStyle = "#0a0c12";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#f5f5f5";
      ctx.fillRect(0, 16, W, 12);
      ctx.fillRect(0, H - 28, W, 12);

      ctx.fillStyle = "rgba(255,255,255,0.16)";
      for (let y = 48; y < H - 48; y += 28) {
        ctx.fillRect(W / 2 - 4, y, 8, 16);
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(left.x, left.y - left.h / 2, left.w, left.h);
      ctx.fillRect(right.x, right.y - right.h / 2, right.w, right.h);
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "700 84px SF Mono, Menlo, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(String(state.leftScore), W * 0.28, 120);
      ctx.fillText(String(state.rightScore), W * 0.72, 120);

      ctx.font = "16px SF Mono, Menlo, Consolas, monospace";
      ctx.globalAlpha = 0.7;
      ctx.textAlign = "left";
      ctx.fillText("J1  W / S", 36, H - 42);
      ctx.textAlign = "right";
      ctx.fillText((state.rightUsesAi ? "CPU" : "J2") + "  SETAS", W - 36, H - 42);
      ctx.globalAlpha = 1;

      if (state.status) {
        ctx.textAlign = "center";
        ctx.font = "700 42px SF Mono, Menlo, Consolas, monospace";
        ctx.fillText("PING PONG", W / 2, H * 0.46);
        ctx.font = "22px SF Mono, Menlo, Consolas, monospace";
        ctx.fillText(state.status, W / 2, H * 0.54);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function createAudio() {
      const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
      const beep = (freq, duration, gainValue) => {
        if (ctxAudio.state === "suspended") ctxAudio.resume();
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(gainValue, ctxAudio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start();
        osc.stop(ctxAudio.currentTime + duration);
      };
      return {
        paddle: () => beep(440, 0.06, 0.05),
        wall: () => beep(330, 0.05, 0.035),
        score: () => beep(220, 0.18, 0.06),
      };
    }

    loop();
  </script>
</body>
</html>
