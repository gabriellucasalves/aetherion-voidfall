<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0710">
    <link rel="manifest" href="manifest.webmanifest">
    <title>AETHERION: APOCALIPSE</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">AETHERION: APOCALIPSE</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl.data.unityweb",
        frameworkUrl: buildUrl + "/webgl.framework.js.unityweb",
        codeUrl: buildUrl + "/webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TrabalhoSexta",
        productName: "Aetherion Voidfall",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
          || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent))) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Fill the visible mobile viewport. Unity adapts its world camera to
        // this aspect ratio instead of squeezing the game into a 16:9 box.
        var container = document.querySelector("#unity-container");
        var hint = document.createElement("div");
        hint.id = "mobile-hint";
        hint.textContent = "Para jogar melhor, gire o celular na horizontal.";
        document.body.appendChild(hint);
        function fitMobileGame() {
          var view = window.visualViewport;
          var width = view ? view.width : window.innerWidth;
          var height = view ? view.height : window.innerHeight;
          container.style.left = (view ? view.offsetLeft : 0) + "px";
          container.style.top = (view ? view.offsetTop : 0) + "px";
          container.style.width = width + "px";
          container.style.height = height + "px";
          var css = getComputedStyle(container);
          var usableWidth = Math.max(1, width - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight));
          var usableHeight = Math.max(1, height - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom));
          canvas.style.width = usableWidth + "px";
          canvas.style.height = usableHeight + "px";
          hint.hidden = width >= height;
        }
        window.addEventListener("resize", fitMobileGame);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fitMobileGame);
          window.visualViewport.addEventListener("scroll", fitMobileGame);
        }
        var fullscreen = document.createElement("button");
        fullscreen.id = "mobile-fullscreen";
        fullscreen.type = "button";
        fullscreen.textContent = "⛶";
        fullscreen.setAttribute("aria-label", "Tela cheia");
        fullscreen.title = "Tela cheia";
        var root = document.documentElement;
        var requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
        // Safari versions without element fullscreen can launch from the Home
        // Screen in standalone mode using the web app metadata above.
        fullscreen.hidden = !requestFullscreen;
        fullscreen.onclick = async function () {
          try {
            await requestFullscreen.call(root);
            if (screen.orientation && screen.orientation.lock) {
              try { await screen.orientation.lock("landscape"); } catch (ignored) {}
            }
          } catch (ignored) {
            // Keep playing normally when the browser declines fullscreen.
          }
          fitMobileGame();
        };
        document.body.appendChild(fullscreen);
        function fullscreenChanged() {
          fullscreen.hidden = !requestFullscreen || !!(document.fullscreenElement || document.webkitFullscreenElement);
          fitMobileGame();
        }
        document.addEventListener("fullscreenchange", fullscreenChanged);
        document.addEventListener("webkitfullscreenchange", fullscreenChanged);
        fitMobileGame();

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "1920px";
        canvas.style.height = "1080px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
